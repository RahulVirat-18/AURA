<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AURA | Enterprise System Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --landing-bg: #F6F1E7;
            --landing-text: #1C1C1C;
            --landing-accent: #C48B7A;
        }

        body.landing-page {
            background: linear-gradient(135deg, #F6F1E7 0%, #FFFDF8 100%);
            color: var(--landing-text);
        }

        .landing-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .landing-header {
            padding: var(--spacing-2xl) 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .landing-logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--color-primary);
            text-transform: uppercase;
            text-decoration: none;
        }

        .landing-logo span {
            color: var(--landing-accent);
        }

        .landing-nav {
            display: flex;
            gap: var(--spacing-2xl);
            align-items: center;
        }

        .landing-nav a {
            color: var(--color-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition-base);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .landing-nav a:hover,
        .landing-nav a.active {
            color: var(--color-primary);
        }

        .landing-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding-bottom: 60px;
        }

        .landing-hero::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(196, 139, 122, 0.08) 0%, transparent 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .landing-section-tag {
            font-size: 12px;
            color: var(--landing-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: var(--spacing-lg);
            display: block;
            font-weight: 700;
        }

        .landing-hero h1 {
            font-size: 56px;
            line-height: 1.2;
            margin: 0 0 var(--spacing-lg) 0;
            letter-spacing: -1px;
            color: var(--color-primary);
            background: linear-gradient(135deg, #7A1E3A 0%, #C48B7A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .landing-hero p {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto var(--spacing-2xl) auto;
            line-height: 1.7;
        }

        .landing-cta-buttons {
            display: flex;
            gap: var(--spacing-lg);
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .landing-cta-btn {
            background: var(--color-primary);
            color: white;
            padding: var(--spacing-lg) var(--spacing-2xl);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--shadow-md);
        }

        .landing-cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            background: #5f1630;
        }

        .landing-cta-btn-secondary {
            background: transparent;
            border: 2px solid var(--color-primary);
            color: var(--color-primary);
        }

        .landing-cta-btn-secondary:hover {
            background: rgba(122, 30, 58, 0.05);
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        .landing-footer {
            padding: var(--spacing-2xl) 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="landing-page">
    <div class="landing-container">
        <header class="landing-header">
            <a href="index.html" class="landing-logo">AURA<span>.</span></a>
            <nav class="landing-nav">
                <a href="index.html" class="active">Home</a>
                <a href="capabilities.html">Features</a>
                <a href="privacy.html">Security</a>
            </nav>
        </header>

        <section class="landing-hero">
            <span class="landing-section-tag"> </span>
            <h1>System Monitoring<br>& Intelligence</h1>
            <p>Real-time performance tracking with predictive analytics. Monitor your infrastructure and stay ahead of
                potential issues.</p>
            <div class="landing-cta-buttons">
                <a href="login.html?mode=register" class="landing-cta-btn">Initialize System</a>
                <a href="login.html" class="landing-cta-btn landing-cta-btn-secondary">Access Node</a>
            </div>
        </section>

        <footer class="landing-footer">AURA © 2026. All rights reserved.</footer>
    </div>
</body>

</html>
